name: Release package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increase for this release"
        required: true
        default: current
        type: choice
        options:
          - current
          - patch
          - minor
          - major

# `contents: write` creates the version commit, tag, and GitHub Release.
# `id-token: write` lets npm's Trusted Publisher authenticate without a saved
# npm write token.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Validate, publish, and release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set the release version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" != "current" ]; then
            npm version "$BUMP" --no-git-tag-version --ignore-scripts
          fi

      - name: Read the release version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Check that this version has not already been published
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          if npm view "code-observatory@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "code-observatory@$PACKAGE_VERSION already exists on npm."
            exit 1
          fi

      - name: Run release checks
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e

      - name: Publish to npm
        run: npm publish

      - name: Commit and tag the release
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json
          if git diff --cached --quiet; then
            echo "Using the version already present on main."
          else
            git commit -m "chore(release): v$VERSION"
          fi
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main --follow-tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes
