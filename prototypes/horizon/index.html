<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizontal Score — CodeHQ canvas prototype</title>
    <link rel="stylesheet" href="../../src/web/styles/tokens.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg-canvas);
        color: var(--text-primary);
        font-family: var(--font-ui);
      }

      button {
        font: inherit;
      }

      .prototype {
        display: grid;
        grid-template-rows: auto 1fr;
        width: 100%;
        height: 100%;
      }

      .header {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-6);
        min-height: 72px;
        padding: var(--space-3) var(--space-5);
        border-bottom: 1px solid var(--border-subtle);
        background: color-mix(in srgb, var(--bg-surface) 92%, transparent);
      }

      .title-block {
        min-width: 0;
      }

      .eyebrow {
        margin: 0 0 2px;
        color: var(--accent-blue);
        font-family: var(--font-mono);
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: var(--fs-xl);
        line-height: var(--lh-tight);
        letter-spacing: -0.015em;
      }

      .subtitle {
        margin: 3px 0 0;
        color: var(--text-secondary);
        font-size: var(--fs-tiny);
      }

      .controls,
      .control-group {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }

      .control-group {
        padding-left: var(--space-2);
        border-left: 1px solid var(--border-subtle);
      }

      .button {
        height: 34px;
        padding: 0 var(--space-3);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        background: var(--bg-raised);
        color: var(--text-secondary);
        cursor: pointer;
        font-size: var(--fs-tiny);
        font-weight: 600;
        transition:
          color var(--dur-fast) var(--ease-standard),
          border-color var(--dur-fast) var(--ease-standard),
          background-color var(--dur-fast) var(--ease-standard);
      }

      .button:hover,
      .button[aria-pressed="true"] {
        border-color: var(--border-strong);
        background: color-mix(in srgb, var(--accent-blue) 7%, var(--bg-raised));
        color: var(--text-primary);
      }

      .button.icon {
        width: 34px;
        padding: 0;
        font-family: var(--font-mono);
        font-size: var(--fs-base);
      }

      .zoom-readout {
        min-width: 50px;
        color: var(--text-tertiary);
        font-family: var(--font-mono);
        font-size: var(--fs-micro);
        text-align: center;
      }

      .viewport {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: auto;
        background-color: var(--bg-canvas);
        scrollbar-color: var(--border-strong) transparent;
        cursor: grab;
      }

      .viewport.dragging {
        cursor: grabbing;
        user-select: none;
      }

      .canvas-shell {
        position: relative;
        width: max-content;
        min-width: 100%;
        min-height: 100%;
        padding: var(--space-5);
      }

      #canvas {
        display: block;
        overflow: visible;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        background-color: var(--bg-canvas);
        background-image: radial-gradient(circle, var(--grid-dot) 1px, transparent 1px);
        background-position: 0 0;
        background-size: 28px 28px;
      }

      .viewport-hint {
        position: fixed;
        right: var(--space-5);
        bottom: var(--space-4);
        z-index: 2;
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-2) var(--space-3);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-md);
        background: color-mix(in srgb, var(--bg-surface) 92%, transparent);
        box-shadow: var(--shadow-node-rest);
        color: var(--text-tertiary);
        font-size: var(--fs-micro);
        pointer-events: none;
      }

      .zone-fill.failure {
        fill: color-mix(in srgb, var(--accent-red) 2.5%, transparent);
      }

      .zone-fill.success {
        fill: color-mix(in srgb, var(--accent-output) 2.5%, transparent);
      }

      .zone-rule {
        stroke: var(--border-subtle);
        stroke-width: 1;
        stroke-dasharray: 3 8;
      }

      .zone-label {
        fill: var(--text-tertiary);
        font-family: var(--font-ui);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.11em;
      }

      .zone-note {
        fill: var(--text-tertiary);
        font-family: var(--font-mono);
        font-size: 10px;
      }

      .node-step {
        filter:
          drop-shadow(0 2px 4px color-mix(in srgb, var(--bg-inset) 58%, transparent))
          drop-shadow(0 14px 28px color-mix(in srgb, var(--bg-inset) 42%, transparent));
      }

      .node-outcome {
        filter: drop-shadow(0 5px 14px color-mix(in srgb, var(--bg-inset) 38%, transparent));
      }

      .node-step .node-bg {
        fill: var(--bg-raised);
        stroke: var(--border-subtle);
        stroke-width: 1;
      }

      .node-step .category-marker {
        fill: currentColor;
      }

      .node-step .top-highlight {
        stroke: color-mix(in srgb, var(--text-primary) 7%, transparent);
        stroke-width: 1;
      }

      .node-step.inferred .category-marker {
        stroke: var(--bg-raised);
        stroke-width: 2;
        stroke-dasharray: 5 4;
      }

      .index-box {
        fill: var(--bg-inset);
        stroke: var(--border-subtle);
        stroke-width: 1;
      }

      .index-text {
        fill: var(--text-tertiary);
        font-family: var(--font-mono);
        font-size: 10px;
      }

      .node-name {
        fill: var(--text-primary);
        font-family: var(--font-ui);
        font-size: 17px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .node-purpose {
        fill: var(--text-secondary);
        font-family: var(--font-ui);
        font-size: 12px;
      }

      .node-category {
        font-family: var(--font-ui);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.09em;
      }

      .node-outcome .node-bg {
        stroke-width: 1;
      }

      .node-outcome.failure .node-bg {
        fill: color-mix(in srgb, var(--accent-red) 6%, var(--bg-surface));
        stroke: color-mix(in srgb, var(--accent-red) 50%, var(--border-strong));
      }

      .node-outcome.success .node-bg {
        fill: color-mix(in srgb, var(--accent-output) 6%, var(--bg-surface));
        stroke: color-mix(in srgb, var(--accent-output) 50%, var(--border-strong));
      }

      .node-outcome.neutral .node-bg {
        fill: var(--bg-surface);
        stroke: var(--border-strong);
      }

      .outcome-glyph.failure {
        fill: var(--accent-red);
      }

      .outcome-glyph.success {
        fill: var(--accent-output);
      }

      .outcome-glyph.neutral {
        fill: var(--text-secondary);
      }

      .outcome-name {
        fill: var(--text-primary);
        font-family: var(--font-ui);
        font-size: 13px;
        font-weight: 650;
      }

      .outcome-purpose {
        fill: var(--text-secondary);
        font-family: var(--font-ui);
        font-size: 10px;
      }

      .edge-halo {
        fill: none;
        stroke: var(--bg-canvas);
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .edge {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .edge.primary {
        stroke: var(--accent-neutral);
        stroke-width: 2.25;
      }

      .edge.failure {
        stroke: var(--accent-red);
        stroke-width: 1.5;
        stroke-dasharray: 7 5;
      }

      .edge.success {
        stroke: var(--accent-output);
        stroke-width: 1.7;
      }

      .edge.conditional {
        stroke: var(--accent-amber);
        stroke-width: 1.5;
        stroke-dasharray: 7 5;
      }

      .edge.async {
        stroke: var(--accent-blue);
        stroke-width: 1.75;
        stroke-dasharray: 1 5;
      }

      .label-bg {
        fill: var(--bg-surface);
        stroke: var(--border-subtle);
        stroke-width: 1;
      }

      .label-bg.failure {
        stroke: color-mix(in srgb, var(--accent-red) 25%, var(--border-subtle));
      }

      .label-bg.success,
      .label-bg.primary {
        stroke: color-mix(in srgb, var(--accent-neutral) 25%, var(--border-subtle));
      }

      .label-bg.conditional {
        stroke: color-mix(in srgb, var(--accent-amber) 25%, var(--border-subtle));
      }

      .label-bg.async {
        stroke: color-mix(in srgb, var(--accent-blue) 25%, var(--border-subtle));
      }

      .edge-label {
        font-family: var(--font-mono);
        font-size: 10px;
      }

      .edge-label.failure {
        fill: var(--accent-red);
      }

      .edge-label.success,
      .edge-label.primary {
        fill: var(--text-secondary);
      }

      .edge-label.conditional {
        fill: var(--accent-amber);
      }

      .edge-label.async {
        fill: var(--accent-blue);
      }

      .loading,
      .error {
        padding: 120px;
        color: var(--text-secondary);
        font-size: var(--fs-base);
      }

      @media (max-width: 900px) {
        .subtitle,
        .zoom-readout {
          display: none;
        }

        .header {
          gap: var(--space-3);
        }

        .button {
          padding: 0 var(--space-2);
        }
      }
    </style>
  </head>
  <body>
    <main class="prototype">
      <header class="header">
        <div class="title-block">
          <p class="eyebrow">Placement prototype · production nodes unchanged</p>
          <h1 id="workflow-title">Horizontal score</h1>
          <p class="subtitle">Execution moves left to right. Failures rise; successful completion resolves beneath the main line.</p>
        </div>
        <div class="controls" aria-label="Prototype controls">
          <div class="control-group" id="workflow-controls"></div>
          <div class="control-group">
            <button class="button icon" id="zoom-out" type="button" aria-label="Zoom out">−</button>
            <span class="zoom-readout" id="zoom-readout">72%</span>
            <button class="button icon" id="zoom-in" type="button" aria-label="Zoom in">+</button>
            <button class="button" id="actual-size" type="button">100%</button>
            <button class="button" id="fit" type="button">Fit all</button>
          </div>
          <div class="control-group">
            <button class="button" id="theme-toggle" type="button">Light</button>
          </div>
        </div>
      </header>

      <div class="viewport" id="viewport">
        <div class="canvas-shell" id="canvas-shell">
          <div class="loading" id="loading">Reading the real workflow files…</div>
          <svg id="canvas" role="img" aria-labelledby="canvas-title canvas-description" hidden>
            <title id="canvas-title">Horizontal workflow score</title>
            <desc id="canvas-description">A left-to-right workflow with failure outcomes above and success outcomes below.</desc>
          </svg>
        </div>
      </div>
      <div class="viewport-hint">⇆ Drag or scroll horizontally · zoom controls preserve the full canvas</div>
    </main>

    <script type="module">
      const SVG_NS = "http://www.w3.org/2000/svg";
      const WORKFLOW_URLS = [
        ["generate-video", "../../examples/motiona/.codehq/workflows/generate-video.json"],
        ["upload-assets", "../../examples/motiona/.codehq/workflows/upload-assets.json"],
      ];

      const CATEGORY = {
        entry: ["--accent-blue", "ENTRY"],
        logic: ["--accent-neutral", "LOGIC"],
        decision: ["--accent-amber", "DECISION"],
        data: ["--accent-green", "DATA"],
        external: ["--accent-violet", "EXTERNAL"],
        output: ["--accent-output", "OUTPUT"],
      };

      const GEOMETRY = {
        nodeWidth: 380,
        nodeGap: 112,
        outcomeHeight: 64,
        marginX: 80,
        stageHeight: 760,
        failureY: 82,
        mainCenterY: 384,
        successY: 604,
        outcomeForwardShift: 54,
        outcomeGap: 30,
      };

      const state = {
        workflows: new Map(),
        activeId: "generate-video",
        zoom: 0.72,
        layout: null,
      };

      const canvas = document.querySelector("#canvas");
      const canvasShell = document.querySelector("#canvas-shell");
      const viewport = document.querySelector("#viewport");
      const loading = document.querySelector("#loading");
      const workflowTitle = document.querySelector("#workflow-title");
      const workflowControls = document.querySelector("#workflow-controls");
      const zoomReadout = document.querySelector("#zoom-readout");

      function svgElement(name, attrs = {}, text) {
        const element = document.createElementNS(SVG_NS, name);
        for (const [key, value] of Object.entries(attrs)) {
          element.setAttribute(key, String(value));
        }
        if (text !== undefined) {
          element.textContent = text;
        }
        return element;
      }

      function primaryConnection(connection) {
        return connection.type === undefined || connection.type === "success";
      }

      function outcomeIds(workflow) {
        const validIds = new Set(workflow.steps.map((step) => step.id));
        const incoming = new Set();
        const outDegree = new Map(workflow.steps.map((step) => [step.id, 0]));
        for (const connection of workflow.connections) {
          if (!validIds.has(connection.from) || !validIds.has(connection.to)) continue;
          incoming.add(connection.to);
          outDegree.set(connection.from, (outDegree.get(connection.from) ?? 0) + 1);
        }
        return new Set(
          workflow.steps
            .filter((step) => step.category === "output" && incoming.has(step.id) && outDegree.get(step.id) === 0)
            .map((step) => step.id),
        );
      }

      function stableTopologicalWorkOrder(workflow, outcomes) {
        const work = workflow.steps.filter((step) => !outcomes.has(step.id));
        const workIds = new Set(work.map((step) => step.id));
        const declarationOrder = new Map(work.map((step, index) => [step.id, index]));
        const inDegree = new Map(work.map((step) => [step.id, 0]));
        const outgoing = new Map(work.map((step) => [step.id, []]));

        for (const connection of workflow.connections) {
          if (!workIds.has(connection.from) || !workIds.has(connection.to) || !primaryConnection(connection)) continue;
          inDegree.set(connection.to, (inDegree.get(connection.to) ?? 0) + 1);
          outgoing.get(connection.from)?.push(connection.to);
        }

        const remaining = new Set(work.map((step) => step.id));
        const ordered = [];
        while (remaining.size > 0) {
          const next = Array.from(remaining)
            .filter((id) => (inDegree.get(id) ?? 0) === 0)
            .sort((a, b) => (declarationOrder.get(a) ?? 0) - (declarationOrder.get(b) ?? 0))[0]
            ?? Array.from(remaining).sort((a, b) => (declarationOrder.get(a) ?? 0) - (declarationOrder.get(b) ?? 0))[0];
          if (next === undefined) break;
          ordered.push(next);
          remaining.delete(next);
          for (const target of outgoing.get(next) ?? []) {
            inDegree.set(target, (inDegree.get(target) ?? 0) - 1);
          }
        }
        return ordered;
      }

      function incomingConnections(workflow, id) {
        return workflow.connections.filter((connection) => connection.to === id);
      }

      function outcomeTone(workflow, id) {
        const types = incomingConnections(workflow, id).map((connection) => connection.type);
        if (types.length > 0 && types.every((type) => type === "failure")) return "failure";
        if (types.length > 0 && types.every((type) => type === undefined || type === "success")) return "success";
        return "neutral";
      }

      function stepHeight(step) {
        return 8 + 24 + (step.purpose.length > 52 ? 32 : 16) + 18;
      }

      function outcomeWidth(step) {
        return Math.min(300, Math.max(200, 76 + step.name.length * 8));
      }

      function arrangeBand(items) {
        let cursor = -Infinity;
        return items
          .sort((a, b) => a.anchorCenterX - b.anchorCenterX || a.declarationIndex - b.declarationIndex)
          .map((item) => {
            const x = Math.max(item.anchorX, cursor);
            cursor = x + item.width + GEOMETRY.outcomeGap;
            return { ...item, x };
          });
      }

      function computeLayout(workflow) {
        const outcomes = outcomeIds(workflow);
        const order = stableTopologicalWorkOrder(workflow, outcomes);
        const byStepId = new Map(workflow.steps.map((step) => [step.id, step]));
        const declarationIndex = new Map(workflow.steps.map((step, index) => [step.id, index]));
        const nodes = new Map();

        order.forEach((id, index) => {
          const step = byStepId.get(id);
          const height = stepHeight(step);
          nodes.set(id, {
            id,
            step,
            type: "step",
            index: declarationIndex.get(id) ?? index,
            x: GEOMETRY.marginX + index * (GEOMETRY.nodeWidth + GEOMETRY.nodeGap),
            y: GEOMETRY.mainCenterY - height / 2,
            width: GEOMETRY.nodeWidth,
            height,
          });
        });

        const bandItems = { failure: [], success: [] };
        for (const step of workflow.steps) {
          if (!outcomes.has(step.id)) continue;
          const incoming = incomingConnections(workflow, step.id);
          const sources = incoming.map((connection) => nodes.get(connection.from)).filter(Boolean);
          const source = sources.sort((a, b) => b.x - a.x)[0];
          if (source === undefined) continue;
          const tone = outcomeTone(workflow, step.id);
          const band = tone === "failure" ? "failure" : "success";
          const width = outcomeWidth(step);
          const anchorCenterX = source.x + source.width / 2 + GEOMETRY.outcomeForwardShift;
          bandItems[band].push({
            id: step.id,
            step,
            tone,
            band,
            sourceId: source.id,
            incoming,
            width,
            height: GEOMETRY.outcomeHeight,
            anchorCenterX,
            anchorX: anchorCenterX - width / 2,
            declarationIndex: declarationIndex.get(step.id) ?? 0,
          });
        }

        for (const item of arrangeBand(bandItems.failure)) {
          nodes.set(item.id, { ...item, type: "outcome", y: GEOMETRY.failureY });
        }
        for (const item of arrangeBand(bandItems.success)) {
          nodes.set(item.id, { ...item, type: "outcome", y: GEOMETRY.successY });
        }

        const maxRight = Math.max(...Array.from(nodes.values()).map((node) => node.x + node.width));
        const width = maxRight + GEOMETRY.marginX;
        const edges = workflow.connections
          .map((connection, index) => ({
            ...connection,
            id: connection.id ?? `${connection.from}->${connection.to}#${index}`,
            sourceNode: nodes.get(connection.from),
            targetNode: nodes.get(connection.to),
          }))
          .filter((edge) => edge.sourceNode !== undefined && edge.targetNode !== undefined);
        return { workflow, nodes, edges, width, height: GEOMETRY.stageHeight };
      }

      function markerFor(edgeClass) {
        if (edgeClass === "failure") return "arrow-failure";
        if (edgeClass === "conditional") return "arrow-conditional";
        if (edgeClass === "async") return "arrow-async";
        if (edgeClass === "success-outcome") return "arrow-success";
        return "arrow-primary";
      }

      function edgeClass(edge) {
        if (edge.targetNode.type === "outcome" && edge.targetNode.tone === "success") return "success-outcome";
        if (edge.type === "failure") return "failure";
        if (edge.type === "conditional") return "conditional";
        if (edge.type === "async") return "async";
        return "primary";
      }

      function edgePath(edge, siblingIndex, siblingCount) {
        const source = edge.sourceNode;
        const target = edge.targetNode;
        if (target.type !== "outcome") {
          const sourceX = source.x + source.width;
          const sourceY = source.y + source.height / 2;
          const targetX = target.x;
          const targetY = target.y + target.height / 2;
          if (Math.abs(sourceY - targetY) < 0.5) {
            return { d: `M${sourceX},${sourceY} L${targetX},${targetY}`, labelX: (sourceX + targetX) / 2, labelY: sourceY - 15 };
          }
          const middleX = (sourceX + targetX) / 2;
          return {
            d: `M${sourceX},${sourceY} L${middleX - 10},${sourceY} Q${middleX},${sourceY} ${middleX},${sourceY + 10} L${middleX},${targetY - 10} Q${middleX},${targetY} ${middleX + 10},${targetY} L${targetX},${targetY}`,
            labelX: middleX,
            labelY: Math.min(sourceY, targetY) - 15,
          };
        }

        const above = target.band === "failure";
        const spread = siblingCount <= 1 ? 0.5 : 0.35 + (siblingIndex / (siblingCount - 1)) * 0.3;
        const sourceX = source.x + source.width * spread;
        const sourceY = above ? source.y : source.y + source.height;
        const targetX = target.x + target.width / 2;
        const targetY = above ? target.y + target.height : target.y;
        // The leftmost outcome takes the outermost lane and each outcome to its right takes a
        // progressively source-nearer lane. That nesting order prevents a rightward horizontal
        // run from crossing a sibling's vertical departure in a multi-outcome fan.
        const laneOffset = 58 + (siblingCount - 1 - siblingIndex) * 14;
        const laneY = above ? sourceY - laneOffset : sourceY + laneOffset;
        const approach = above ? targetY + 12 : targetY - 12;
        const d = [
          `M${sourceX},${sourceY}`,
          `L${sourceX},${laneY}`,
          `Q${sourceX},${laneY + (above ? -10 : 10)} ${sourceX + 10},${laneY + (above ? -10 : 10)}`,
          `L${targetX - 10},${laneY + (above ? -10 : 10)}`,
          `Q${targetX},${laneY + (above ? -10 : 10)} ${targetX},${laneY + (above ? -20 : 20)}`,
          `L${targetX},${approach}`,
          `L${targetX},${targetY}`,
        ].join(" ");
        return {
          d,
          labelX: sourceX + (targetX - sourceX) * 0.5,
          labelY: laneY + (above ? -24 : 24),
        };
      }

      function edgeLabelWidth(text) {
        return 18 + text.length * 6.2;
      }

      function renderDefs(root) {
        const defs = svgElement("defs");
        const markers = [
          ["arrow-primary", "--accent-neutral"],
          ["arrow-failure", "--accent-red"],
          ["arrow-conditional", "--accent-amber"],
          ["arrow-async", "--accent-blue"],
          ["arrow-success", "--accent-output"],
        ];
        for (const [id, token] of markers) {
          const marker = svgElement("marker", {
            id,
            viewBox: "0 0 9 9",
            refX: 7.5,
            refY: 4.5,
            markerWidth: 7,
            markerHeight: 7,
            markerUnits: "userSpaceOnUse",
            orient: "auto-start-reverse",
          });
          marker.append(svgElement("path", { d: "M0,0 L9,4.5 L0,9 z", fill: `var(${token})` }));
          defs.append(marker);
        }
        root.append(defs);
      }

      function renderZones(root, layout) {
        root.append(
          svgElement("rect", { class: "zone-fill failure", x: 20, y: 20, width: layout.width - 40, height: 176, rx: 10 }),
          svgElement("rect", { class: "zone-fill success", x: 20, y: 562, width: layout.width - 40, height: 178, rx: 10 }),
          svgElement("line", { class: "zone-rule", x1: 48, y1: 54, x2: layout.width - 48, y2: 54 }),
          svgElement("line", { class: "zone-rule", x1: 48, y1: 582, x2: layout.width - 48, y2: 582 }),
          svgElement("text", { class: "zone-label", x: 48, y: 43 }, "FAILURE OUTCOMES"),
          svgElement("text", { class: "zone-note", x: 226, y: 43 }, "exceptions rise out of the score"),
          svgElement("text", { class: "zone-label", x: 48, y: 571 }, "SUCCESS / COMPLETION"),
          svgElement("text", { class: "zone-note", x: 252, y: 571 }, "resolution settles beneath the final step"),
          svgElement("text", { class: "zone-label", x: 48, y: GEOMETRY.mainCenterY - 72 }, "EXECUTION SCORE"),
          svgElement("text", { class: "zone-note", x: 204, y: GEOMETRY.mainCenterY - 72 }, "read left → right"),
        );
      }

      function renderEdges(root, layout) {
        const bySourceAndBand = new Map();
        for (const edge of layout.edges) {
          if (edge.targetNode.type !== "outcome") continue;
          const key = `${edge.sourceNode.id}:${edge.targetNode.band}`;
          const list = bySourceAndBand.get(key) ?? [];
          list.push(edge.id);
          bySourceAndBand.set(key, list);
        }

        const edgeLayer = svgElement("g", { "data-layer": "edges" });
        const labelLayer = svgElement("g", { "data-layer": "labels" });
        for (const edge of layout.edges) {
          const key = edge.targetNode.type === "outcome" ? `${edge.sourceNode.id}:${edge.targetNode.band}` : "";
          const siblings = bySourceAndBand.get(key) ?? [edge.id];
          const geometry = edgePath(edge, Math.max(0, siblings.indexOf(edge.id)), siblings.length);
          const variant = edgeClass(edge);
          const semanticClass = variant === "success-outcome" ? "success" : variant;
          const haloWidth = variant === "primary" ? 4.25 : 3.5;
          edgeLayer.append(
            svgElement("path", { class: "edge-halo", d: geometry.d, "stroke-width": haloWidth }),
            svgElement("path", {
              class: `edge ${semanticClass}`,
              d: geometry.d,
              "data-edge-id": edge.id,
              "data-source": edge.from,
              "data-target": edge.to,
              "marker-end": `url(#${markerFor(variant)})`,
            }),
          );

          const label = edge.label?.trim();
          if (label) {
            const width = edgeLabelWidth(label);
            labelLayer.append(
              svgElement("rect", {
                class: `label-bg ${semanticClass}`,
                x: geometry.labelX - width / 2,
                y: geometry.labelY - 10,
                width,
                height: 20,
                rx: 3,
              }),
              svgElement(
                "text",
                {
                  class: `edge-label ${semanticClass}`,
                  x: geometry.labelX,
                  y: geometry.labelY + 3.5,
                  "text-anchor": "middle",
                },
                label,
              ),
            );
          }
        }
        root.append(edgeLayer, labelLayer);
      }

      function splitPurpose(text, maxChars = 58) {
        if (text.length <= maxChars) return [text];
        const firstBreak = text.lastIndexOf(" ", maxChars);
        const first = text.slice(0, firstBreak > 0 ? firstBreak : maxChars);
        const rest = text.slice(first.length).trim();
        if (rest.length <= maxChars) return [first, rest];
        return [first, `${rest.slice(0, maxChars - 1).trim()}…`];
      }

      function renderStepNode(node) {
        const [categoryToken, categoryLabel] = CATEGORY[node.step.category] ?? ["--accent-neutral", "UNSPECIFIED"];
        const group = svgElement("g", {
          class: `node-step ${node.step.confidence === "inferred" ? "inferred" : ""}`,
          transform: `translate(${node.x} ${node.y})`,
          "data-node-id": node.id,
          "data-node-kind": "step",
        });
        group.style.color = `var(${categoryToken})`;
        group.append(
          svgElement("rect", { class: "node-bg", width: node.width, height: node.height, rx: 8 }),
          svgElement("line", { class: "top-highlight", x1: 9, y1: 1, x2: node.width - 9, y2: 1 }),
          svgElement("rect", { class: "category-marker", width: 4, height: node.height, rx: 2 }),
          svgElement("rect", { class: "index-box", x: 16, y: 10, width: 24, height: 18, rx: 2 }),
          svgElement("text", { class: "index-text", x: 28, y: 22.5, "text-anchor": "middle" }, String(node.index + 1).padStart(2, "0")),
          svgElement("text", { class: "node-name", x: 49, y: 25 }, node.step.name),
        );
        const purposeLines = splitPurpose(node.step.purpose);
        purposeLines.forEach((line, index) => {
          group.append(svgElement("text", { class: "node-purpose", x: 16, y: 46 + index * 15 }, line));
        });
        group.append(
          svgElement(
            "text",
            { class: "node-category", x: 16, y: node.height - 9, fill: `var(${categoryToken})` },
            categoryLabel,
          ),
        );
        return group;
      }

      function renderOutcomeNode(node) {
        const group = svgElement("g", {
          class: `node-outcome ${node.tone}`,
          transform: `translate(${node.x} ${node.y})`,
          "data-node-id": node.id,
          "data-node-kind": "outcome",
          "data-outcome-tone": node.tone,
        });
        const glyph = node.tone === "failure" ? "×" : node.tone === "success" ? "✓" : "—";
        group.append(
          svgElement("rect", { class: "node-bg", width: node.width, height: node.height, rx: node.height / 2 }),
          svgElement("text", { class: `outcome-glyph ${node.tone}`, x: 22, y: 37, "text-anchor": "middle", "font-size": 17, "font-weight": 700 }, glyph),
          svgElement("text", { class: "outcome-name", x: 40, y: 27 }, node.step.name),
          svgElement("text", { class: "outcome-purpose", x: 40, y: 44 }, `${node.step.purpose.slice(0, 36)}${node.step.purpose.length > 36 ? "…" : ""}`),
        );
        return group;
      }

      function renderNodes(root, layout) {
        const layer = svgElement("g", { "data-layer": "nodes" });
        for (const node of layout.nodes.values()) {
          layer.append(node.type === "step" ? renderStepNode(node) : renderOutcomeNode(node));
        }
        root.append(layer);
      }

      function render() {
        const workflow = state.workflows.get(state.activeId);
        if (workflow === undefined) return;
        const layout = computeLayout(workflow);
        state.layout = layout;
        canvas.replaceChildren();
        canvas.setAttribute("viewBox", `0 0 ${layout.width} ${layout.height}`);
        canvas.setAttribute("data-workflow-id", workflow.id);
        canvas.hidden = false;
        loading.hidden = true;
        workflowTitle.textContent = workflow.name;

        canvas.append(
          svgElement("title", { id: "canvas-title" }, `${workflow.name} horizontal score`),
          svgElement(
            "desc",
            { id: "canvas-description" },
            "A left-to-right workflow with failure outcomes above and success outcomes below.",
          ),
        );
        renderDefs(canvas);
        renderZones(canvas, layout);
        renderEdges(canvas, layout);
        renderNodes(canvas, layout);
        updateZoom(false);
        for (const button of workflowControls.querySelectorAll("button")) {
          button.setAttribute("aria-pressed", String(button.dataset.workflowId === workflow.id));
        }
      }

      function updateZoom(preserveCenter = true) {
        if (state.layout === null) return;
        const oldWidth = canvas.getBoundingClientRect().width;
        const centerRatio = oldWidth > 0 ? (viewport.scrollLeft + viewport.clientWidth / 2) / oldWidth : 0;
        const width = state.layout.width * state.zoom;
        const height = state.layout.height * state.zoom;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        canvasShell.style.width = `${width + 40}px`;
        canvasShell.style.height = `${Math.max(height + 40, viewport.clientHeight)}px`;
        zoomReadout.textContent = `${Math.round(state.zoom * 100)}%`;
        if (preserveCenter) {
          requestAnimationFrame(() => {
            viewport.scrollLeft = Math.max(0, centerRatio * width - viewport.clientWidth / 2);
          });
        }
      }

      function setZoom(next) {
        state.zoom = Math.min(1.25, Math.max(0.25, next));
        updateZoom();
      }

      function fitAll() {
        if (state.layout === null) return;
        const horizontal = (viewport.clientWidth - 72) / state.layout.width;
        const vertical = (viewport.clientHeight - 72) / state.layout.height;
        state.zoom = Math.min(1, horizontal, vertical);
        updateZoom(false);
        viewport.scrollTo({ left: 0, top: 0 });
      }

      function buildWorkflowControls() {
        for (const workflow of state.workflows.values()) {
          const button = document.createElement("button");
          button.className = "button";
          button.type = "button";
          button.dataset.workflowId = workflow.id;
          button.textContent = workflow.id === "generate-video" ? "Generate video" : "Upload asset";
          button.addEventListener("click", () => {
            state.activeId = workflow.id;
            viewport.scrollTo({ left: 0, top: 0 });
            render();
          });
          workflowControls.append(button);
        }
      }

      document.querySelector("#zoom-out").addEventListener("click", () => setZoom(state.zoom - 0.1));
      document.querySelector("#zoom-in").addEventListener("click", () => setZoom(state.zoom + 0.1));
      document.querySelector("#actual-size").addEventListener("click", () => setZoom(1));
      document.querySelector("#fit").addEventListener("click", fitAll);
      document.querySelector("#theme-toggle").addEventListener("click", (event) => {
        const root = document.documentElement;
        const next = root.dataset.theme === "light" ? "dark" : "light";
        root.dataset.theme = next;
        event.currentTarget.textContent = next === "light" ? "Dark" : "Light";
      });

      let dragOrigin = null;
      viewport.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        dragOrigin = { x: event.clientX, left: viewport.scrollLeft };
        viewport.classList.add("dragging");
        viewport.setPointerCapture(event.pointerId);
      });
      viewport.addEventListener("pointermove", (event) => {
        if (dragOrigin === null) return;
        viewport.scrollLeft = dragOrigin.left - (event.clientX - dragOrigin.x);
      });
      const stopDragging = (event) => {
        if (dragOrigin === null) return;
        dragOrigin = null;
        viewport.classList.remove("dragging");
        if (viewport.hasPointerCapture(event.pointerId)) viewport.releasePointerCapture(event.pointerId);
      };
      viewport.addEventListener("pointerup", stopDragging);
      viewport.addEventListener("pointercancel", stopDragging);

      window.addEventListener("resize", () => updateZoom(false));

      try {
        const loaded = await Promise.all(
          WORKFLOW_URLS.map(async ([id, url]) => {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Failed to load ${url}: ${response.status}`);
            return [id, await response.json()];
          }),
        );
        state.workflows = new Map(loaded);
        buildWorkflowControls();
        render();
        window.horizonPrototype = {
          setZoom,
          fitAll,
          setTheme(theme) {
            document.documentElement.dataset.theme = theme;
            document.querySelector("#theme-toggle").textContent = theme === "light" ? "Dark" : "Light";
          },
          selectWorkflow(id) {
            if (!state.workflows.has(id)) throw new Error(`Unknown workflow: ${id}`);
            state.activeId = id;
            viewport.scrollTo({ left: 0, top: 0 });
            render();
          },
          getLayout() {
            return state.layout;
          },
        };
      } catch (error) {
        loading.className = "error";
        loading.textContent = error instanceof Error ? error.message : String(error);
        throw error;
      }
    </script>
  </body>
</html>
